<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RTSP Camera Settings - IMX219</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh; padding: 20px; color: #eee; 
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { 
            text-align: center; margin-bottom: 30px; color: #00d4ff;
            text-shadow: 0 0 10px rgba(0,212,255,0.5); 
        }
        .card { 
            background: rgba(255,255,255,0.1); border-radius: 15px;
            padding: 20px; margin-bottom: 20px; backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .card h2 { 
            color: #00d4ff; margin-bottom: 15px; font-size: 1.2em;
            border-bottom: 1px solid rgba(0,212,255,0.3); padding-bottom: 10px; 
        }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
        input[type='range'] { 
            width: 100%; height: 8px; border-radius: 4px;
            background: #333; outline: none; -webkit-appearance: none; 
        }
        input[type='range']::-webkit-slider-thumb { 
            -webkit-appearance: none;
            width: 20px; height: 20px; border-radius: 50%; background: #00d4ff;
            cursor: pointer; box-shadow: 0 0 10px rgba(0,212,255,0.5); 
        }
        input[type='checkbox'] { width: 20px; height: 20px; cursor: pointer; }
        select { 
            width: 100%; padding: 10px; border-radius: 8px; border: none;
            background: #333; color: #eee; font-size: 1em; 
        }
        .value-display { float: right; color: #00d4ff; font-weight: bold; }
        .btn { 
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 100%);
            color: #000; border: none; padding: 12px 30px; border-radius: 8px;
            font-size: 1em; cursor: pointer; font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s; 
        }
        .btn:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.4); 
        }
        .btn:active { transform: translateY(0); }
        .btn-container { text-align: center; margin-top: 20px; }
        .status { 
            text-align: center; padding: 10px; border-radius: 8px;
            margin-top: 10px; display: none; 
        }
        .status.success { display: block; background: rgba(0,255,0,0.2); color: #0f0; }
        .status.error { display: block; background: rgba(255,0,0,0.2); color: #f00; }
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }
        .info { 
            background: rgba(0,212,255,0.1); padding: 15px; border-radius: 8px;
            margin-bottom: 20px; text-align: center; 
        }
        .sensor-badge {
            display: inline-block; background: #00d4ff; color: #000;
            padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.8em;
        }
        .color-preview {
            width: 100%; height: 30px; border-radius: 8px; margin-top: 10px;
            border: 1px solid rgba(255,255,255,0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 RTSP Camera Settings</h1>
        
        <div class="info">
            <span class="sensor-badge">IMX219</span> |
            <strong>Stream:</strong> rtsp://<span id="streamIP">--</span>:554/stream | 
            <strong>Resolution:</strong> <span id="resolution">--</span>
        </div>
        
        <form id="settingsForm">
            <div class="card">
                <h2>🔆 Exposure (IMX219)</h2>
                <div class="form-group">
                    <label><input type="checkbox" id="autoExposure" onchange="toggleExposure()"> Auto Exposure (ISP)</label>
                </div>
                <div id="manualExposure">
                    <div class="form-group">
                        <label>Exposure Time (lines) <span class="value-display" id="expVal">512</span></label>
                        <input type="range" id="exposure" min="4" max="1760" value="512" oninput="updateVal('expVal', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Analog Gain (0-232) <span class="value-display" id="gainVal">64</span></label>
                        <input type="range" id="gain" min="0" max="232" value="64" oninput="updateVal('gainVal', this.value)">
                    </div>
                </div>
            </div>
            
            <div class="card">
                <h2>🎨 White Balance (ISP)</h2>
                <div class="form-group">
                    <label><input type="checkbox" id="autoWB" checked onchange="toggleWB()"> Auto White Balance</label>
                </div>
                <div id="manualWB" style="display:none">
                    <div class="row">
                        <div class="form-group">
                            <label>Red <span class="value-display" id="wbRedVal">1024</span></label>
                            <input type="range" id="wbRed" min="256" max="4095" value="1024" oninput="updateWB()">
                        </div>
                        <div class="form-group">
                            <label>Green <span class="value-display" id="wbGreenVal">1024</span></label>
                            <input type="range" id="wbGreen" min="256" max="4095" value="1024" oninput="updateWB()">
                        </div>
                        <div class="form-group">
                            <label>Blue <span class="value-display" id="wbBlueVal">1024</span></label>
                            <input type="range" id="wbBlue" min="256" max="4095" value="1024" oninput="updateWB()">
                        </div>
                    </div>
                    <div id="wbPreview" class="color-preview"></div>
                </div>
            </div>
            
            <div class="card">
                <h2>🧪 Test Pattern (IMX219)</h2>
                <div class="form-group">
                    <label>Pattern Mode</label>
                    <select id="testPattern">
                        <option value="0">Disabled (Live Camera)</option>
                        <option value="1">Solid Color</option>
                        <option value="2">Color Bars (8 colors)</option>
                        <option value="3">Grey Color Bars</option>
                        <option value="4">PN9 (pseudo-random)</option>
                    </select>
                </div>
            </div>
            
            <div class="card">
                <h2>🔇 Noise Reduction (ISP)</h2>
                <div class="form-group">
                    <label><input type="checkbox" id="denoiseEnable" checked onchange="toggleDenoise()"> Enable Denoising</label>
                </div>
                <div class="form-group" id="denoiseGroup">
                    <label>Denoise Level <span class="value-display" id="denoiseVal">10</span></label>
                    <input type="range" id="denoiseLevel" min="2" max="20" value="10" oninput="updateVal('denoiseVal', this.value)">
                </div>
            </div>
            
            <div class="card">
                <h2>💡 Anti-Flicker</h2>
                <div class="form-group">
                    <label>Power Line Frequency</label>
                    <select id="powerLineFreq">
                        <option value="0">Disabled</option>
                        <option value="1" selected>50 Hz (Europe)</option>
                        <option value="2">60 Hz (USA)</option>
                    </select>
                </div>
            </div>
            
            <div class="card">
                <h2>🎬 H.264 Encoder</h2>
                <div class="form-group">
                    <label>Bitrate (kbps) <span class="value-display" id="bitrateVal">4000</span></label>
                    <input type="range" id="bitrate" min="500" max="10000" step="250" value="4000" oninput="updateVal('bitrateVal', this.value)">
                </div>
                <div class="form-group">
                    <label>GOP Size (I-frame interval) <span class="value-display" id="gopVal">30</span></label>
                    <input type="range" id="gop" min="1" max="120" value="30" oninput="updateVal('gopVal', this.value)">
                </div>
                <div class="row">
                    <div class="form-group">
                        <label>Min QP <span class="value-display" id="minQpVal">20</span></label>
                        <input type="range" id="minQp" min="0" max="51" value="20" oninput="updateVal('minQpVal', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Max QP <span class="value-display" id="maxQpVal">40</span></label>
                        <input type="range" id="maxQp" min="0" max="51" value="40" oninput="updateVal('maxQpVal', this.value)">
                    </div>
                </div>
            </div>
            
            <div class="btn-container">
                <button type="submit" class="btn">💾 Save Settings</button>
            </div>
            <div id="status" class="status"></div>
        </form>
    </div>
    
    <script>
        function updateVal(id, val) { 
            document.getElementById(id).textContent = val; 
        }
        
        function toggleExposure() {
            document.getElementById('manualExposure').style.display = 
                document.getElementById('autoExposure').checked ? 'none' : 'block';
        }
        
        function toggleWB() {
            document.getElementById('manualWB').style.display = 
                document.getElementById('autoWB').checked ? 'none' : 'block';
        }
        
        function toggleDenoise() {
            document.getElementById('denoiseGroup').style.display = 
                document.getElementById('denoiseEnable').checked ? 'block' : 'none';
        }
        
        function updateWB() {
            const r = parseInt(document.getElementById('wbRed').value);
            const g = parseInt(document.getElementById('wbGreen').value);
            const b = parseInt(document.getElementById('wbBlue').value);
            updateVal('wbRedVal', r);
            updateVal('wbGreenVal', g);
            updateVal('wbBlueVal', b);
            // Preview: normalize to 0-255 for CSS (1024 = 1.0x = 128 in preview)
            const rPrev = Math.min(255, Math.round(r / 16));
            const gPrev = Math.min(255, Math.round(g / 16));
            const bPrev = Math.min(255, Math.round(b / 16));
            document.getElementById('wbPreview').style.background = 
                'rgb(' + rPrev + ', ' + gPrev + ', ' + bPrev + ')';
        }
        
        // Set stream IP address from current hostname
        document.getElementById('streamIP').textContent = window.location.hostname;
        
        // Load current settings
        fetch('/api/settings').then(function(r) { return r.json(); }).then(function(data) {
            document.getElementById('resolution').textContent = 
                data.width + 'x' + data.height + ' @ ' + data.fps + 'fps';
            document.getElementById('autoExposure').checked = data.auto_exposure;
            document.getElementById('exposure').value = data.exposure_value;
            document.getElementById('gain').value = data.gain;
            document.getElementById('autoWB').checked = data.auto_white_balance;
            document.getElementById('wbRed').value = data.wb_red_gain || 1024;
            document.getElementById('wbGreen').value = data.wb_green_gain || 1024;
            document.getElementById('wbBlue').value = data.wb_blue_gain || 1024;
            document.getElementById('testPattern').value = data.test_pattern || 0;
            document.getElementById('denoiseEnable').checked = data.denoise_enable;
            document.getElementById('denoiseLevel').value = data.denoise_level;
            document.getElementById('powerLineFreq').value = data.power_line_freq;
            document.getElementById('bitrate').value = data.bitrate;
            document.getElementById('gop').value = data.gop;
            document.getElementById('minQp').value = data.min_qp;
            document.getElementById('maxQp').value = data.max_qp;
            
            updateVal('expVal', data.exposure_value);
            updateVal('gainVal', data.gain);
            updateVal('denoiseVal', data.denoise_level);
            updateVal('bitrateVal', data.bitrate);
            updateVal('gopVal', data.gop);
            updateVal('minQpVal', data.min_qp);
            updateVal('maxQpVal', data.max_qp);
            
            toggleExposure();
            toggleWB();
            toggleDenoise();
            updateWB();
        });
        
        document.getElementById('settingsForm').onsubmit = function(e) {
            e.preventDefault();
            var data = {
                auto_exposure: document.getElementById('autoExposure').checked,
                exposure_value: parseInt(document.getElementById('exposure').value),
                gain: parseInt(document.getElementById('gain').value),
                auto_white_balance: document.getElementById('autoWB').checked,
                wb_red_gain: parseInt(document.getElementById('wbRed').value),
                wb_green_gain: parseInt(document.getElementById('wbGreen').value),
                wb_blue_gain: parseInt(document.getElementById('wbBlue').value),
                test_pattern: parseInt(document.getElementById('testPattern').value),
                denoise_enable: document.getElementById('denoiseEnable').checked,
                denoise_level: parseInt(document.getElementById('denoiseLevel').value),
                power_line_freq: parseInt(document.getElementById('powerLineFreq').value),
                bitrate: parseInt(document.getElementById('bitrate').value),
                gop: parseInt(document.getElementById('gop').value),
                min_qp: parseInt(document.getElementById('minQp').value),
                max_qp: parseInt(document.getElementById('maxQp').value)
            };
            
            fetch('/api/settings', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(function(r) { return r.json(); }).then(function(resp) {
                var status = document.getElementById('status');
                if (resp.success) {
                    status.className = 'status success';
                    status.textContent = '✓ Settings saved!';
                } else {
                    status.className = 'status error';
                    status.textContent = '✗ Error: ' + resp.error;
                }
                setTimeout(function() { status.className = 'status'; }, 3000);
            });
        };
    </script>
</body>
</html>
